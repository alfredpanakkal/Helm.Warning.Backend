name: NAVAREA IX Ingestion Pipeline

on:
  schedule:
    # NHO Pakistan updates the page during Karachi office hours,
    # roughly 0300-1000 UTC. Run once daily after the workday starts.
    - cron: '30 4 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/navarea_ix_scraper.py'
      - 'scripts/run_navarea_ix.py'
      - 'scripts/navarea_universal_parser.py'
      - 'scripts/navarea_generic_sync.py'
      - 'shared/navarea_universal_text.py'
      - 'shared/sync_engine.py'
      - 'shared/models.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-ix-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    # Backfill controls (IX 050/26 mojibake sweep, 2026-10-30): a
    # plain UI dispatch cannot set IX_FULL_SNAPSHOT (an env var read
    # by scripts/navarea_ix_scraper.py), so expose it as an input.
    inputs:
      full_snapshot:
        description: 'Full harvest - ignore stored-row skipping (IX_FULL_SNAPSHOT=1)'
        required: false
        type: boolean
        default: false
      max_requests:
        description: 'Request cap for this run (IX_MAX_REQUESTS_PER_RUN; a full sweep needs > 60)'
        required: false
        type: string
        default: '60'

concurrency:
  # '-bounded' suffix (NAVAREA V lesson, 2026-10-28): a run wedged in
  # this group (site hang / WAF stall — no cancel tool available)
  # otherwise queues every later run behind it for GitHub's 6-hour
  # default job timeout. Renaming the group lets the queue move on;
  # timeout-minutes below caps any single hang at 20 minutes.
  group: navarea-ix-sync-engine-bounded
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-navarea-ix-warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for NAVAREA IX
        run: |
          set -o pipefail
          python -m unittest tests.test_navarea_ix_scraper -v 2>&1 | tee ix_tests.log

      - name: Scrape, Parse and Sync NAVAREA IX
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # workflow_dispatch backfill controls (see inputs above);
          # empty on schedule/push/PR runs (inputs context is empty).
          IX_FULL_SNAPSHOT: ${{ inputs.full_snapshot && '1' || '' }}
          IX_MAX_REQUESTS_PER_RUN: ${{ inputs.max_requests || '60' }}
        run: |
          set -o pipefail
          # GNU timeout bounds a wedged harvest (site/WAF stall): the
          # python dies at 15 min (healthy run ~6-8) with the log kept
          # by tee, so the failure-report step below still posts the
          # tail. The job-level timeout-minutes backstop never has to
          # cancel the whole job — cancellation skips the report step
          # (seen live 2026-10-28, when a 20-min job timeout cancelled
          # a wedged run and posted nothing).
          PYTHONPATH=${{ github.workspace }} timeout 900 python -m scripts.run_navarea_ix 2>&1 | tee ix_ingest.log

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/ix/latest_raw.txt ]; then
            echo "Scraper error: navareas/ix/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/ix/parsed.json ]; then
            echo "Parser error: navareas/ix/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "❌ **ingest-navarea-ix-warnings failed** on ${{ github.sha }}"
            echo ""
            echo '~~~'
            for f in ix_tests.log ix_ingest.log; do
              if [ -f "$f" ]; then
                echo "--- $f (tail 200) ---"
                tail -n 200 "$f"
                echo ""
              fi
            done
            echo '~~~'
          } > comment_ix.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment_ix.md
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-ix-warnings-data
          path: |
            navareas/ix/latest_raw.html
            navareas/ix/latest_raw.txt
            navareas/ix/parsed.json
          retention-days: 7
          if-no-files-found: ignore
