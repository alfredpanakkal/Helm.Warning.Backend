name: All NAVAREA Ingestion Pipelines

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: all-navareas-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-all-pipelines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps


      - name: Run All NAVAREA Pipelines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.run_all

      - name: Upload All Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-navarea-warnings-data
          path: |
            navareas/baltic/navarea_baltic_warnings.txt
            navareas/baltic/parsed_baltic_warnings.json
            navareas/navarea_1/navarea_1_warnings.txt
            navareas/navarea_1/parsed_navarea_1_warnings.json
            navareas/navarea_xi/navarea_xi_warnings.txt
            navareas/navarea_xi/parsed_navarea_xi_warnings.json
            navareas/navarea_xii/navarea_xii_warnings.txt
            navareas/navarea_xii/parsed_navarea_xii_warnings.json
          retention-days: 7
          if-no-files-found: ignore
