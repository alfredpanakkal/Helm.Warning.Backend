name: Manual Bulk Paste Ingest

on:
  workflow_dispatch:
    inputs:
      navarea:
        description: 'NAVAREA region of the pasted text'
        required: true
        type: choice
        options:
          - '8'
          - '1'
          - 'iv'
          - 'xi'
          - 'xii'
          - 'baltic'
      raw_text:
        description: 'Paste the raw warning bulletin text (bulk)'
        required: true
        type: string

concurrency:
  group: manual-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Multiline workflow_dispatch inputs cannot safely pass through env
      # vars, so read them from the workflow_dispatch event JSON instead.
      - name: Write pasted text to file
        run: |
          jq -r '.inputs.raw_text' "$GITHUB_EVENT_PATH" > pasted.txt
          echo "Region: $(jq -r '.inputs.navarea' "$GITHUB_EVENT_PATH")"
          wc -l pasted.txt

      - name: Parse and sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          NAVAREA=$(jq -r '.inputs.navarea' "$GITHUB_EVENT_PATH")
          python -m scripts.run_manual_paste --navarea "$NAVAREA" --input pasted.txt 2>&1 | tee manual_ingest.log
          exit ${PIPESTATUS[0]}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-ingest-${{ inputs.navarea }}-${{ github.run_id }}
          path: |
            pasted.txt
            manual_ingest.log
            navareas/manual/*/parsed.json
          if-no-files-found: ignore
          retention-days: 14
