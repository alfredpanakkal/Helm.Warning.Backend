name: NAVAREA XI Ingestion Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/navarea_xi_*'
      - 'scripts/run_navarea_xi.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-xi-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navarea-xi-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-navarea-xi-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for NAVAREA XI
        run: |
          python -m unittest tests.test_navarea_xi -v

      - name: Harvest Bulletins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_navarea_xi

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/navarea_xi/navarea_xi_warnings.txt ]; then
            echo "Scraper error: navarea_xi_warnings.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/navarea_xi/parsed_navarea_xi_warnings.json ]; then
            echo "Parser error: parsed_navarea_xi_warnings.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Differential Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.navarea_xi_sync

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-xi-warnings-data
          path: |
            navareas/navarea_xi/navarea_xi_warnings.txt
            navareas/navarea_xi/parsed_navarea_xi_warnings.json
          retention-days: 7
          if-no-files-found: ignore
