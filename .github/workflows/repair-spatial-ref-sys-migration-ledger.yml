name: Repair Supabase Migration Ledger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-migration-ledger-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact migration file
        run: |
          test -f migrations/20261120150000_sync_spatial_ref_sys_api_guard.sql
          echo "Verified migration file exists."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mark the already-applied migration in Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          supabase migration repair 20261120150000 \
            --status applied \
            --yes \
            --remote=ocqpfbkuiomzhbxxvemi
