name: NAVAREA Baltic Ingestion Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/baltic_*'
      - 'scripts/run_baltic.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/baltic-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: baltic-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-baltic-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Module Importability
        run: |
          PYTHONPATH=${{ github.workspace }} python -c "import scripts; import scripts.run_baltic; import scripts.baltic_scraper; import scripts.baltic_parser; import scripts.baltic_sync; print('All Baltic pipeline modules imported successfully')"

      - name: Run Unit Tests for Baltic
        run: |
          PYTHONPATH=${{ github.workspace }} python -m unittest tests.test_baltic -v

      - name: Harvest Bulletins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_baltic

      - name: Verify Output Files
        run: |
          echo "Verifying generated files in navareas/baltic:"
          if [ ! -f navareas/baltic/navarea_baltic_warnings.txt ]; then
            echo "Scraper error: navarea_baltic_warnings.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/baltic/parsed_baltic_warnings.json ]; then
            echo "Parser error: parsed_baltic_warnings.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Differential Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.baltic_sync

      - name: Debug Summary
        if: always()
        run: |
          echo "=== Debug Summary: navareas/baltic ==="
          ls -la navareas/baltic || echo "Directory does not exist"

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baltic-warnings-data
          path: |
            navareas/baltic/navarea_baltic_warnings.txt
            navareas/baltic/parsed_baltic_warnings.json
          retention-days: 7
          if-no-files-found: ignore

