name: Norwegian Coastal Warnings (Kystverket) Ingestion Pipeline

on:
  schedule:
    # Kystverket publishes the coastal (kystvarsel) series throughout
    # the day; a 6-hourly cadence mirrors the all-sync rhythm, offset
    # from the NAVAREA XIX run on the same site.
    - cron: '55 1,7,13,19 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/kystverket_coastal_scraper.py'
      - 'scripts/run_kystverket_coastal.py'
      - 'scripts/navarea_universal_parser.py'
      - 'scripts/navarea_generic_sync.py'
      - 'shared/navarea_universal_text.py'
      - 'shared/translation.py'
      - 'shared/sync_engine.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/coastal-no-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coastal-no-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-coastal-no-warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for Coastal NO
        run: |
          python -m unittest tests.test_kystverket_coastal_scraper -v

      - name: Scrape, Parse and Sync Coastal NO Warnings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_kystverket_coastal

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/coastal_no/latest_raw.txt ]; then
            echo "Scraper error: navareas/coastal_no/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/coastal_no/parsed.json ]; then
            echo "Parser error: navareas/coastal_no/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastal-no-warnings-data
        path: |
          navareas/coastal_no/latest_raw.html
          navareas/coastal_no/latest_raw.txt
          navareas/coastal_no/latest_raw_no.txt
          navareas/coastal_no/parsed.json
        retention-days: 7
        if-no-files-found: ignore
