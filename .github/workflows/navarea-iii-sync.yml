name: NAVAREA III Ingestion Pipeline

on:
  schedule:
    # IHM publishes the in-force list daily around 0600 UTC.
    - cron: '30 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/navarea_iii_scraper.py'
      - 'scripts/run_navarea_iii.py'
      - 'scripts/navarea_universal_parser.py'
      - 'scripts/navarea_generic_sync.py'
      - 'shared/navarea_universal_text.py'
      - 'shared/sync_engine.py'
      - 'shared/models.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-iii-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navarea-iii-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-navarea-iii-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for NAVAREA III
        run: |
          python -m unittest tests.test_navarea_iii_scraper -v

      - name: Scrape, Parse and Sync NAVAREA III
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_navarea_iii

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/iii/latest_raw.txt ]; then
            echo "Scraper error: navareas/iii/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/iii/parsed.json ]; then
            echo "Parser error: navareas/iii/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-iii-warnings-data
          path: |
            navareas/iii/latest_raw.xml
            navareas/iii/latest_raw.txt
            navareas/iii/parsed.json
          retention-days: 7
          if-no-files-found: ignore
