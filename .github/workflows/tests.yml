name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest discovery
        run: |
          set +e
          python -m unittest discover tests -v 2>&1 | tee unittest.log
          # capture the discovery exit code IMMEDIATELY: PIPESTATUS is
          # overwritten by every subsequent command, so reading it after
          # the isolation run below always yielded 0 and masked failures.
          rc=${PIPESTATUS[0]}
          echo "=== test_lifecycle_safety in isolation ===" >> unittest.log
          python -m unittest tests.test_lifecycle_safety -v >> unittest.log 2>&1 || true
          exit $rc
      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "❌ **unittest failed** on ${{ github.sha }}"
            echo ""
            echo '~~~'
            tail -n 220 unittest.log
            echo '~~~'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: Add test output to run summary
        if: always()
        run: |
          if [ -f unittest.log ]; then
            echo '### Unit test output (last 220 lines)' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 220 unittest.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unit test log was not created.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ github.run_id }}
          path: unittest.log
          if-no-files-found: warn
          retention-days: 7
