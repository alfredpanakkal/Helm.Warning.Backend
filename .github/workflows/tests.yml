name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest discovery
        run: |
          set +e
          python -m unittest discover tests -v 2>&1 | tee unittest.log
          echo "=== test_lifecycle_safety in isolation ===" >> unittest.log
          python -m unittest tests.test_lifecycle_safety -v >> unittest.log 2>&1 || true
          exit ${PIPESTATUS[0]}
      - name: Report failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "❌ **unittest failed** on ${{ github.sha }}"
            echo ""
            echo '~~~'
            tail -n 220 unittest.log
            echo '~~~'
          } > comment.md
          gh pr comment 24 --repo "$GITHUB_REPOSITORY" --body-file comment.md
