name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest discovery
        run: |
          set +e
          python -m unittest discover tests -v 2>&1 | tee unittest.log
          exit ${PIPESTATUS[0]}
      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "❌ **unittest failed** on ${{ github.sha }}

          ```
          $(tail -n 120 unittest.log)
          ```"
