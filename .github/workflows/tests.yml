name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest discovery
        run: python -m unittest discover tests -v
