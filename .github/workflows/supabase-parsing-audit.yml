name: Supabase Parsing Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit, propose, or apply approved corrections'
        required: true
        type: choice
        options:
          - audit_only
          - propose_corrections
          - apply_approved
        default: audit_only

      navarea:
        description: 'Optional NAVAREA filter; blank means all'
        required: false
        type: string

      model:
        description: 'Gemini model identifier (fail-closed: run aborts if the model cannot be verified)'
        required: false
        type: string
        default: 'gemini-3.8-flash'

      proposal_ids:
        description: 'Approved proposal UUIDs for apply mode (comma-separated or JSON array)'
        required: false
        type: string

      confirm_apply:
        description: 'Explicit authorization required for apply_approved (leave false for read-only runs)'
        required: false
        type: boolean
        default: false

  # Phase 5 WP2: weekly scheduled audit_only run, Gemini off, read-only.
  # Wednesday 10:30 UTC sits inside the verified quiet window (~09:00-11:30 UTC
  # weekdays, after IX 04:30 / III 06:30 / VII 08:30 and clear of the every-6h
  # all-sync runs). Scheduled runs carry no workflow_dispatch inputs, so the
  # audit job defaults INPUT_MODE to 'audit_only' below — a schedule can never
  # trigger propose_corrections or apply_approved. The concurrency group stays,
  # so a scheduled run cannot overlap a manual one.
  schedule:
    - cron: '30 10 * * 3'

permissions:
  contents: read

concurrency:
  group: supabase-parsing-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.mode != 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ inputs.model || vars.GEMINI_MODEL_NAME || 'gemini-3.8-flash' }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_MODE: ${{ inputs.mode || 'audit_only' }}
          INPUT_NAVAREA: ${{ inputs.navarea }}
        run: |
          ARGS=(--mode "$INPUT_MODE" --report-dir audit-report --model-name "$GEMINI_MODEL_NAME")
          if [[ -n "$INPUT_NAVAREA" ]]; then
            ARGS+=(--navarea "$INPUT_NAVAREA")
          fi
          python -m scripts.audit_supabase_parsing "${ARGS[@]}"

      # Phase 5 WP3-lite: alert on incomplete scheduled scans. The audit script
      # exits 0 even on a partial scan (status='partial'), so green != complete.
      # This step makes scheduled runs fail loudly instead, which sends the
      # GitHub workflow-failure email (chosen alert channel). Manual runs keep
      # the existing behaviour. always() so the alert fires even if the audit
      # step itself failed. Alert is on scan completeness only for now; the
      # baseline_v2.json regression comparison (WP3 full) lands with WP1 after
      # the Phase 4 after-report exists.
      - name: Alert on incomplete scheduled scan
        if: github.event_name == 'schedule' && always()
        run: |
          SUMMARY_FILE="audit-report/summary.json"
          if [[ ! -f "$SUMMARY_FILE" ]]; then
            echo "::error::Scheduled audit produced no summary.json — the run did not complete."
            exit 1
          fi
          STATUS=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE')).get('status'))")
          SCAN_COMPLETE=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE')).get('scan_complete'))")
          EXAMINED=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE')).get('examined_count'))")
          ISSUES=$(python3 -c "import json; print(json.load(open('$SUMMARY_FILE')).get('issue_count'))")
          {
            echo "## Scheduled parsing audit"
            echo "- status: ${STATUS}"
            echo "- examined: ${EXAMINED}"
            echo "- issues: ${ISSUES}"
            echo "- scan complete: ${SCAN_COMPLETE}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCAN_COMPLETE" != "True" || "$STATUS" != "succeeded" ]]; then
            echo "::error::Scheduled audit scan incomplete (status=${STATUS}, scan_complete=${SCAN_COMPLETE}, examined=${EXAMINED}, issues=${ISSUES}). Failing the workflow to trigger the failure email."
            exit 1
          fi
          echo "[audit] Scheduled audit OK: examined=${EXAMINED}, issues=${ISSUES}."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-parsing-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 90

  apply-approved:
    if: inputs.mode == 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-corrections

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate apply authorization
        if: inputs.confirm_apply != true
        run: |
          echo "::error::apply_approved requires confirm_apply=true (explicit authorization). Aborting without touching the database."
          exit 2

      - name: Apply approved corrections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_PROPOSAL_IDS: ${{ inputs.proposal_ids }}
        run: |
          if [[ -z "$INPUT_PROPOSAL_IDS" ]]; then
            echo "No proposal IDs supplied; refusing to write."
            exit 1
          fi
          python -m scripts.audit_supabase_parsing \
            --mode apply_approved \
            --proposal-ids "$INPUT_PROPOSAL_IDS"
