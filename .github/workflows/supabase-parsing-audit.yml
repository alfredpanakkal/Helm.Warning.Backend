name: Supabase Parsing Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit, propose, or apply approved corrections'
        required: true
        type: choice
        options:
          - audit_only
          - propose_corrections
          - apply_approved
        default: audit_only

      navarea:
        description: 'Optional NAVAREA filter; blank means all'
        required: false
        type: string

      proposal_ids:
        description: 'Approved proposal UUIDs for apply mode (comma-separated or JSON array)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-parsing-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.mode != 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_NAVAREA: ${{ inputs.navarea }}
        run: |
          ARGS=(--mode "$INPUT_MODE" --report-dir audit-report)
          if [[ -n "$INPUT_NAVAREA" ]]; then
            ARGS+=(--navarea "$INPUT_NAVAREA")
          fi
          python -m scripts.audit_supabase_parsing "${ARGS[@]}"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-parsing-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

  apply-approved:
    if: inputs.mode == 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-corrections

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply approved corrections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_PROPOSAL_IDS: ${{ inputs.proposal_ids }}
        run: |
          if [[ -z "$INPUT_PROPOSAL_IDS" ]]; then
            echo "No proposal IDs supplied; refusing to write."
            exit 1
          fi
          python -m scripts.audit_supabase_parsing \
            --mode apply_approved \
            --proposal-ids "$INPUT_PROPOSAL_IDS"
