name: Supabase Parsing Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit, propose, or apply approved corrections'
        required: true
        type: choice
        options:
          - audit_only
          - propose_corrections
          - apply_approved
        default: audit_only

      navarea:
        description: 'Optional NAVAREA filter; blank means all'
        required: false
        type: string

      model:
        description: 'Gemini model identifier (fail-closed: run aborts if the model cannot be verified)'
        required: false
        type: string
        default: 'gemini-3.8-flash'

      proposal_ids:
        description: 'Approved proposal UUIDs for apply mode (comma-separated or JSON array)'
        required: false
        type: string

      confirm_apply:
        description: 'Explicit authorization required for apply_approved (leave false for read-only runs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-parsing-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.mode != 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ inputs.model || vars.GEMINI_MODEL_NAME || 'gemini-3.8-flash' }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_NAVAREA: ${{ inputs.navarea }}
        run: |
          ARGS=(--mode "$INPUT_MODE" --report-dir audit-report --model-name "$GEMINI_MODEL_NAME")
          if [[ -n "$INPUT_NAVAREA" ]]; then
            ARGS+=(--navarea "$INPUT_NAVAREA")
          fi
          python -m scripts.audit_supabase_parsing "${ARGS[@]}"

      # WP2: workflow-level guard (decision: BOTH the script non-zero
      # exit AND this step). Belt-and-braces against future drift where
      # the script might exit 0 on an incomplete scan. The upload step is
      # `if: always()`, so the artifact is still uploaded for analysis.
      - name: Fail on incomplete scan
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open("audit-report/summary.json", encoding="utf-8") as fh:
                  summary = json.load(fh)
          except FileNotFoundError:
              print("::error::summary.json missing - the audit produced no report.")
              sys.exit(1)
          if summary.get("scan_complete") is not True:
              print(
                  "::error::Scan incomplete (status=%s, scan_status=%s, reason=%s) "
                  "- artifact uploaded, but counts are NOT trustworthy."
                  % (
                      summary.get("status"),
                      summary.get("scan_status"),
                      summary.get("incomplete_reason"),
                  )
              )
              sys.exit(1)
          print("Scan-complete gate passed (report_version=%s)." % summary.get("report_version"))
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-parsing-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

  apply-approved:
    if: inputs.mode == 'apply_approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-corrections

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate apply authorization
        if: inputs.confirm_apply != true
        run: |
          echo "::error::apply_approved requires confirm_apply=true (explicit authorization). Aborting without touching the database."
          exit 2

      - name: Apply approved corrections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          INPUT_PROPOSAL_IDS: ${{ inputs.proposal_ids }}
        run: |
          if [[ -z "$INPUT_PROPOSAL_IDS" ]]; then
            echo "No proposal IDs supplied; refusing to write."
            exit 1
          fi
          python -m scripts.audit_supabase_parsing \
            --mode apply_approved \
            --proposal-ids "$INPUT_PROPOSAL_IDS"
