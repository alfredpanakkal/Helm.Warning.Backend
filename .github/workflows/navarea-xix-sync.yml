name: NAVAREA XIX Ingestion Pipeline

on:
  schedule:
    # Kystverket publishes the NAVAREA XIX series throughout the day;
    # a 6-hourly cadence mirrors the all-sync rhythm, offset from it.
    - cron: '25 1,7,13,19 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/navarea_xix_scraper.py'
      - 'scripts/run_navarea_xix.py'
      - 'scripts/navarea_universal_parser.py'
      - 'scripts/navarea_generic_sync.py'
      - 'shared/navarea_universal_text.py'
      - 'shared/translation.py'
      - 'shared/sync_engine.py'
      - 'shared/models.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-xix-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navarea-xix-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-navarea-xix-warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for NAVAREA XIX
        run: |
          python -m unittest tests.test_navarea_xix_scraper -v

      - name: Scrape, Parse and Sync NAVAREA XIX
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_navarea_xix

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/navarea_xix/latest_raw.txt ]; then
            echo "Scraper error: navareas/navarea_xix/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/navarea_xix/parsed.json ]; then
            echo "Parser error: navareas/navarea_xix/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-xix-warnings-data
        path: |
          navareas/navarea_xix/latest_raw.html
          navareas/navarea_xix/latest_raw.txt
          navareas/navarea_xix/parsed.json
        retention-days: 7
        if-no-files-found: ignore
