name: NAVAREA V Ingestion Pipeline

on:
  schedule:
    # CHM refreshes the JSON snapshot daily (atualizado observed at
    # 04:00 local / 07:00 UTC).
    - cron: '30 7 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/navarea_v_scraper.py'
      - 'scripts/run_navarea_v.py'
      - 'scripts/navarea_universal_parser.py'
      - 'scripts/navarea_generic_sync.py'
      - 'shared/navarea_universal_text.py'
      - 'shared/sync_engine.py'
      - 'shared/models.py'
      - 'shared/utils.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-v-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navarea-v-sync-engine
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-navarea-v-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for NAVAREA V
        run: |
          set -o pipefail
          PYTHONPATH=${{ github.workspace }} python -m unittest tests.test_navarea_v_scraper -v 2>&1 | tee v_tests.log

      - name: Scrape, Parse and Sync NAVAREA V
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          set -o pipefail
          PYTHONPATH=${{ github.workspace }} python -m scripts.run_navarea_v 2>&1 | tee v_ingest.log

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/navarea_v/latest_raw.txt ]; then
            echo "Scraper error: navareas/navarea_v/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/navarea_v/parsed.json ]; then
            echo "Parser error: navareas/navarea_v/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "❌ **ingest-navarea-v-warnings failed** on ${{ github.sha }}"
            echo ""
            echo '~~~'
            for f in v_tests.log v_ingest.log; do
              if [ -f "$f" ]; then
                echo "--- $f (tail 200) ---"
                tail -n 200 "$f"
                echo ""
              fi
            done
            echo '~~~'
          } > comment_v.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment_v.md
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-v-warnings-data
          path: |
            navareas/navarea_v/latest_raw.json
            navareas/navarea_v/latest_raw.txt
            navareas/navarea_v/parsed.json
          retention-days: 7
          if-no-files-found: ignore
