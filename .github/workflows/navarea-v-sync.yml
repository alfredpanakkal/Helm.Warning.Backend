name: NAVAREA V Ingestion Pipeline

# 2026-10-31: automatic triggers (schedule + push) removed by maintainer
# decision. The CHM portal is Cloudflare-walled from GitHub runner IPs, so
# automated runs are designed to fail. NAVAREA V is manual-import-only
# (paste avradio_NN.json via the manual ingest queue) or via a manual
# workflow_dispatch run. Also excluded from the sync-all orchestrator
# (scripts/run_all.py). PR dry-runs kept for CI signal.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Renamed 2026-10-27 (was 'navarea-v-sync-engine'): a StealthyFetcher
  # Cloudflare-solve run hung on the old group and would have queued
  # every later run behind it for hours. Keep this name.
  group: navarea-v-sync-engine-bounded
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-navarea-v-warnings:
    runs-on: ubuntu-latest
    # Hard bound: the StealthyFetcher Cloudflare-solve layer can hang
    # indefinitely on an unsolvable challenge (seen 2026-10-27).
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # CI/CD compute trim: the ~170 MB Chromium download is the
      # single biggest per-run cost of the browser fallback layer.
      # Cache it between runs; `patchright install` no-ops on hit.
      - name: Cache Patchright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            patchright-chromium-${{ runner.os }}-
      # StealthyFetcher runs on Patchright (patched Chromium) and
      # needs the browser binary for the Cloudflare-solving fetch
      # layer in scripts/navarea_v_scraper.py (CI 2026-10-27:
      # 'Executable doesn't exist ... Please run: patchright install').
      - name: Install Patchright browser for StealthyFetcher
        run: |
          python -m patchright install chromium || patchright install chromium || echo "patchright install failed; StealthyFetcher layer unavailable"
      - name: Run Unit Tests for NAVAREA V
        run: |
          set -o pipefail
          PYTHONPATH=${{ github.workspace }} python -m unittest tests.test_navarea_v_scraper -v 2>&1 | tee v_tests.log

      - name: Scrape, Parse and Sync NAVAREA V
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          set -o pipefail
          # 10-min bound: a hung browser-layer fetch must fail loudly
          # instead of blocking the job for hours.
          timeout 600 env PYTHONPATH=${{ github.workspace }} python -m scripts.run_navarea_v 2>&1 | tee v_ingest.log

      # Fail-closed observability: surface the blocked state as a
      # GitHub error annotation, so a failed run reads as 'NAVAREA V
      # BLOCKED — manual import needed' instead of silently going stale.
      - name: Annotate blocked state
        if: failure()
        run: |
          echo "::error title=NAVAREA V blocked::NAVAREA V scrape is BLOCKED — no result published (Cloudflare wall or empty snapshot); manual import needed: paste the avradio_NN.json contents via the manual ingest queue (region 'v')."

      - name: Verify Output Files
        run: |
          if [ ! -f navareas/navarea_v/latest_raw.txt ]; then
            echo "Scraper error: navareas/navarea_v/latest_raw.txt not generated!"
            exit 1
          fi
          if [ ! -f navareas/navarea_v/parsed.json ]; then
            echo "Parser error: navareas/navarea_v/parsed.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "❌ **ingest-navarea-v-warnings failed** on ${{ github.sha }}"
            echo ""
            echo '~~~'
            for f in v_tests.log v_ingest.log; do
              if [ -f "$f" ]; then
                echo "--- $f (tail 200) ---"
                tail -n 200 "$f"
                echo ""
              fi
            done
            echo '~~~'
          } > comment_v.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment_v.md
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-v-warnings-data
          path: |
            navareas/navarea_v/latest_raw.json
            navareas/navarea_v/latest_raw.txt
            navareas/navarea_v/parsed.json
          retention-days: 7
          if-no-files-found: ignore
