name: Supabase Full Backup

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup-supabase:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Optional pg_dump (full schema + data) if SUPABASE_DB_URL secret is set
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret not set — skipping pg_dump (PostgREST JSON export below is the backup)."
            exit 0
          fi
          mkdir -p backups
          pg_dump --version
          pg_dump "$SUPABASE_DB_URL" --schema=public -f backups/schema.sql
          pg_dump "$SUPABASE_DB_URL" -Fc -f "backups/supabase_full_$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "pg_dump complete."

      - name: Export All Table Data (PostgREST JSON, admin_users excluded)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PYTHONPATH=${{ github.workspace }} python -m scripts.backup_supabase

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: warn
