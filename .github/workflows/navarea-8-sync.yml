name: NAVAREA 8 Ingestion Pipeline

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

concurrency:
  group: navarea-8-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  navarea-8-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run NAVAREA VIII Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.run_navarea_8

      - name: Upload NAVAREA VIII Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-8-warnings-data
          path: |
            navareas/navarea_8/navarea_8_warnings.txt
            navareas/navarea_8/parsed_navarea_8_warnings.json
            navareas/navarea_8/latest_warnings.pdf
          retention-days: 7
          if-no-files-found: ignore
